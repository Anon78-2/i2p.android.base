# Mostly copied from https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant
# zlatinb

name: Build I2P Router APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gettext git

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Create build override
        run: |
          rm -f override.properties
          echo "build.built-by=GitHub Actions" >> override.properties
          echo "noExe=true" >> override.properties

      - name: Fetch matching I2P core source
        run: |
          echo "i2psrc=$HOME/i2p.i2p" > routerjars/local.properties
          git clone --depth 1 --branch i2p-2.4.0 https://github.com/i2p/i2p.i2p "$HOME/i2p.i2p"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          find app/build/outputs -type f -name "*.apk"

      - name: Upload router debug APK
        uses: actions/upload-artifact@v4
        with:
          name: i2p-router-debug-apk
          path: app/build/outputs/apk/free/debug/app-free-debug.apk
          if-no-files-found: error
          retention-days: 7
